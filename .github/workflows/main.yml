name: Update Incendies

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Télécharger les incendies
        run: |
          curl -o incendies.json https://incendieencours.fr/data/fire_events_live.json

      - name: Vérifier le téléchargement
        run: |
          ls -l
          head incendies.json
